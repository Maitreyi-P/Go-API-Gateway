services:
  # backend-a and backend-b build from the identical Dockerfile and build
  # context, so Docker's layer cache means the second build is effectively
  # free - they're the same image content, just instantiated twice with
  # different env vars. (They intentionally don't share one explicit
  # `image:` tag: Compose can't have two services race to export the same
  # tag concurrently under `docker compose up --build`.)
  backend-a:
    build:
      context: .
      dockerfile: cmd/mockbackend/Dockerfile
    environment:
      PORT: "9001"
      BACKEND_NAME: backend-a
    # A real gateway deployment wouldn't publish backend ports to the host
    # at all - clients should only ever reach backends through the
    # gateway. These are published anyway, deliberately, so
    # scripts/load_test.sh and scripts/chaos_demo.sh can hit
    # localhost:9001/9002 directly, exactly as they do in the local
    # (non-Docker) setup, with no changes needed to run them against this
    # containerized stack.
    ports:
      - "9001:9001"
    networks:
      - gateway-net
    restart: unless-stopped

  backend-b:
    build:
      context: .
      dockerfile: cmd/mockbackend/Dockerfile
    environment:
      PORT: "9002"
      BACKEND_NAME: backend-b
    ports:
      - "9002:9002"
    networks:
      - gateway-net
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      - backend-a
      - backend-b
    networks:
      - gateway-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    networks:
      - gateway-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Real defaults (admin/admin), just pre-set so Grafana skips the
      # forced "set a new password" prompt on first login - one less
      # manual step before the dashboard is usable.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - gateway-net
    restart: unless-stopped

networks:
  gateway-net:
    driver: bridge
