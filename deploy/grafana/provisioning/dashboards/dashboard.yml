# Tells Grafana to load any dashboard JSON files it finds in the mounted
# /var/lib/grafana/dashboards directory (see docker-compose.yml) - no
# manual "Import dashboard" step needed.
apiVersion: 1

providers:
  - name: gateway
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
