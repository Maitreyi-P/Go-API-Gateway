routes:
  - path_prefix: /api/users
    backends:
      - http://localhost:9001
      - http://localhost:9002
    rate_limit:
      requests_per_second: 5
      burst: 10
    circuit_breaker:
      failure_threshold: 0.5
      window_seconds: 10
      cooldown_seconds: 15

  - path_prefix: /api/orders
    backends:
      - http://localhost:9003
    rate_limit:
      requests_per_second: 5
      burst: 10
    circuit_breaker:
      failure_threshold: 0.5
      window_seconds: 10
      cooldown_seconds: 15
